name: Build and deploy Gadfly to Azure App Service

# Deploys Gadfly.Server (the Gadfly Exams web app + platform API). GAD-T63, docs/DEPLOY.md.
#   build    restore, publish Gadfly.Server, build an EF migrations bundle
#   migrate  apply pending migrations to the Azure SQL database (the deploy step owns DDL; the web app never migrates)
#   deploy   push the package to the App Service, restart it, wait for /healthz and /login
#
# Manual only (workflow_dispatch) until the Azure resources exist: run tools/provision-azure.ps1 first
# (docs/DEPLOY.md), add the repo secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID, then
# switch the trigger to push on main if wanted.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # azure/login OIDC

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  PUBLISH_PROJECT: Gadfly.Server/Gadfly.Server.csproj
  AZURE_RESOURCE_GROUP: MyApps
  APP: mindattic-gadfly
  SQL_SERVER: sql-mindattic-f65744.database.windows.net
  SQL_DATABASE: Gadfly
  DOTNET_VERSION: '10.x'

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # MindAttic.* packages come from the git-tracked lib/local-packages feed (no C:\LocalNuGet on a runner).
      - name: Restore
        run: dotnet restore ${{ env.PUBLISH_PROJECT }} --ignore-failed-sources

      - name: Publish
        run: dotnet publish ${{ env.PUBLISH_PROJECT }} -c Release -o publish --no-restore

      - name: Migrations bundle
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations bundle --project Gadfly.Server --configuration Release --self-contained -r win-x64 -o efbundle/efbundle.exe

      - uses: actions/upload-artifact@v7
        with:
          name: gadfly-app
          path: publish/

      - uses: actions/upload-artifact@v7
        with:
          name: gadfly-efbundle
          path: efbundle/

  migrate:
    runs-on: windows-2025
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gadfly-efbundle
          path: efbundle/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # "Active Directory Default" picks up the az login above; the deploy identity is db_ddladmin on Gadfly.
      - name: Apply migrations
        shell: pwsh
        run: |
          $cs = "Server=tcp:$env:SQL_SERVER,1433;Database=$env:SQL_DATABASE;Authentication=Active Directory Default;Encrypt=True;Connect Timeout=120;"
          ./efbundle/efbundle.exe --connection $cs

  deploy:
    runs-on: windows-2025
    needs: migrate
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gadfly-app
          path: publish/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP }}
          package: publish/

      - name: Restart onto the new build
        shell: pwsh
        run: az webapp restart --resource-group $env:AZURE_RESOURCE_GROUP --name $env:APP

      # The serverless database may be paused; the first connection after a pause takes about a minute.
      - name: Smoke-test health and the sign-in page
        shell: pwsh
        run: |
          $base = "https://$env:APP.azurewebsites.net"
          foreach ($path in '/healthz', '/login') {
            $ok = $false
            $deadline = (Get-Date).AddMinutes(12)
            while (-not $ok -and (Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest -Uri "$base$path" -UseBasicParsing -TimeoutSec 120
                if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "${path}: 200" }
              } catch { Write-Host "${path}: $($_.Exception.Message)" }
              if (-not $ok) { Start-Sleep -Seconds 15 }
            }
            if (-not $ok) { throw "$base$path never returned 200." }
          }

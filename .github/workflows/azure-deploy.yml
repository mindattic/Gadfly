name: Build and deploy Gadfly to Azure App Service

# Deploys Gadfly.Server (the Gadfly Exams web app + platform API). GAD-T63, docs/DEPLOY.md.
#
# This workflow does not have its own deploy steps. It signs in to Azure and runs tools/deploy-azure.ps1, the same
# script MindAttic.Deploy runs, so a CI deploy and a desk deploy are one code path and can never drift apart again
# (GAD-T477: the old copy here had no V<N> version, no vN tag and no mock-mode check). The script:
#   refuses a commit not on origin/main and an app whose Gadfly__AiMode is not mock,
#   exports the commit with git archive, migrates the database first (stops if that fails),
#   publishes with -p:GadflyVersion=<N>, zip-deploys and follows the Kudu deployment,
#   waits for /healthz and /login to answer 200, and only then tags the commit vN and pushes the tag.
# Change the steps in the script, never here.
#
# The target input picks one of the script's three targets (GAD-T652, docs/DEPLOY.md "Staging and production slots"):
#   production  build the commit, migrate Gadfly, deploy to production, tag vN (the script's default)
#   staging     -Slot staging: build the commit as the next V<N>, migrate Gadfly-staging, deploy to the staging slot; no tag
#   promote     -Promote: build nothing; migrate Gadfly with the commit staging runs, swap staging into production, tag vN
#
# Manual only (workflow_dispatch). Needs the repo secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID and
# the deploy identity set up per docs/DEPLOY.md (Website Contributor on the app, a user on the Gadfly database that can
# alter it). Run it from main: the script refuses anything not on origin/main.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'production (deploy straight to production), staging (deploy to the staging slot, no tag) or promote (swap what staging runs into production, tag vN)'
        type: choice
        options:
          - production
          - staging
          - promote
        default: production
      dry_run:
        description: 'Dry run: export, restore, list migrations, publish and zip; migrate, deploy and tag nothing'
        type: boolean
        default: false

permissions:
  contents: write          # the script pushes the vN tag after a successful production deploy or promotion
  id-token: write          # azure/login OIDC

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'

jobs:
  deploy:
    runs-on: windows-2025
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw "Deploys run from main only (this run is on $env:GITHUB_REF)."

      # Full history and tags: the script checks the commit is on origin/main and numbers the deploy from the vN tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Tools for the script
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef
          # NuGet.config lists the dev-box feed C:\LocalNuGet; an empty folder keeps restore from failing on a runner.
          # The MindAttic.* packages come from the git-tracked lib/local-packages feed.
          New-Item -ItemType Directory -Force C:\LocalNuGet | Out-Null
          # The script creates an annotated vN tag.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # A dry run signs in too: it lists the database's pending migrations.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # No -AllowLive and no -AllowUnpushed, ever: a live-mode app or an unpushed commit is a desk decision, made by
      # running the script by hand.
      - name: Deploy with tools/deploy-azure.ps1
        shell: pwsh
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # promote ignores Ref: it promotes the commit the staging slot reports at /healthz/version.
          switch ($env:DEPLOY_TARGET) {
            'production' { $deployArgs = @{ Ref = $env:GITHUB_SHA } }
            'staging'    { $deployArgs = @{ Ref = $env:GITHUB_SHA; Slot = 'staging' } }
            'promote'    { $deployArgs = @{ Promote = $true } }
            default      { throw "Unknown target '$env:DEPLOY_TARGET' (production, staging or promote)." }
          }
          if ($env:DRY_RUN -eq 'true') { $deployArgs.DryRun = $true }
          ./tools/deploy-azure.ps1 @deployArgs
